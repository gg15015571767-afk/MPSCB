[project]
name = "mpscb"
version = "0.1.0"
description = "MPSCB 智能客服系统 — 基于 Nanobot"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    # nanobot：本地 ../nanobot（v0.3.0-775，领先 PyPI 0.3.0）；本地 editable 安装，Docker 构建时 COPY 安装
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
]

[project.entry-points."nanobot.tools"]
match_faq = "mpscb.tools.faq_tool:MatchFaqTool"
record_question = "mpscb.tools.question_tool:RecordQuestionTool"
get_user_preference = "mpscb.tools.preference_tool:GetPreferenceTool"
set_user_preference = "mpscb.tools.preference_tool:SetPreferenceTool"
record_feedback = "mpscb.tools.feedback_tool:RecordFeedbackTool"

[project.scripts]
mpscb-ticket = "mpscb.mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
