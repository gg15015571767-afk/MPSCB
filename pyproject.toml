[project]
name = "mpscb"
version = "0.1.0"
description = "MPSCB 智能客服系统 — 基于 Nanobot"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    # nanobot-ai：本地 ../nanobot，editable 安装（模块5 接入）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
